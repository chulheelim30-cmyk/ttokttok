<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FBF7F2">
<script src="kakao.js?v=1"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이곁">
<meta name="description" content="아픈 강아지·고양이 케어 기록. 급여량 계산, 투약·수액·증상 기록, 병원 요약을 가족과 함께.">
<meta property="og:title" content="아이곁 — 아픈 아이 케어 기록">
<meta property="og:description" content="가족이 함께 쓰는 반려동물 케어 기록">
<link rel="icon" href="icon-192.png">
<title>아이곁 — 아픈 아이 케어 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2D2A26; --sub:#7A726A; --line:#ECE5DC;
  --acc:#E07A5F; --acc-soft:#FBE7E1; --ok:#3D8B7D; --ok-soft:#E1F1EE;
  --warn:#C0392B; --warn-soft:#FDECEA; --blue:#4A6FA5; --blue-soft:#E6EDF7;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.3px}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer;min-height:72px}
.qbtn .ic{font-size:22px;line-height:1}
.qbtn:active{transform:scale(.97)}
.bar{height:12px;background:#F1ECE6;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #CFC6BB;flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.check.done .box{background:var(--ok);border-color:var(--ok)}
.check.done .lbl{color:var(--sub);text-decoration:line-through}
.check .who{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.log{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px;background:#F4EFE9}
.log .body{flex:1;min-width:0}
.log .t{font-size:12px;color:var(--sub)}
.log .x{border:0;background:none;color:#B9AFA4;font-size:13px;cursor:pointer;padding:4px}
.log .x.sure{color:var(--warn);font-weight:700}
.log.alert .ic{background:var(--warn-soft)}
.daylbl{font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.danger.on{background:var(--warn);border-color:var(--warn)}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:#FFFDFB;border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.acc{background:var(--acc)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.res{background:var(--ok-soft);border-radius:14px;padding:14px;margin-top:12px}
.res .k{font-size:13px;color:var(--sub)}
.res table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.res td{padding:5px 0;border-top:1px solid rgba(0,0,0,.06)}
.res td:last-child{text-align:right;font-weight:700}
.alertbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:14px;font-size:14px;margin-top:10px}
.alertbox b{display:block;font-size:15px;margin-bottom:2px}
.note{background:var(--blue-soft);color:#2F4C77;border-radius:14px;padding:12px 14px;font-size:13px}
pre.sum{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#FFFDFB;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.38);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;display:none;max-width:560px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .grab{width:40px;height:4px;background:#D9D0C5;border-radius:4px;margin:-6px auto 12px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.edit-row .grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="hdrName">아이곁</span><small id="hdrSub">아픈 아이 케어 기록</small></div>
    <span id="sync" class="pill">연결 중…</span>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const r1 = n => Math.round(n * 10) / 10;
const r0 = n => Math.round(n);
const pad = n => String(n).padStart(2, '0');
const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dkey(Date.now());
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayLabel = k => {
  if (k === today()) return '오늘';
  if (k === dkey(Date.now() - 864e5)) return '어제';
  const d = new Date(k + 'T00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
};
const localDT = t => { const d = new Date(t); return dkey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = () => Math.random().toString(36).slice(2, 10);
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }

/* ---------- domain ---------- */
const TYPES = {
  feed:    { ic: '🥄', name: '급여' },
  med:     { ic: '💊', name: '투약' },
  fluid:   { ic: '💧', name: '수액' },
  symptom: { ic: '🩺', name: '증상' },
  weight:  { ic: '⚖️', name: '체중' },
  potty:   { ic: '🚽', name: '배변·소변' },
  lab:     { ic: '🧪', name: '검사' },
  note:    { ic: '📝', name: '메모' },
};
const LABS = [
  { k: 'crea', n: '크레아티닌', u: 'mg/dL', re: /크레아?티닌|크레아틴|creat?i?n?i?n?e?|crea/i },
  { k: 'bun', n: 'BUN', u: 'mg/dL', re: /bun|요소\s?질소|비유엔/i },
  { k: 'sdma', n: 'SDMA', u: 'μg/dL', re: /sdma/i },
  { k: 'phos', n: '인', u: 'mg/dL', re: /phos|인\s?수치|인산|(^|\s)인(?=\s?\d)/i },
  { k: 'k', n: '칼륨', u: 'mEq/L', re: /칼륨|포타슘|(^|\s)k(?=\s?\d)/i },
  { k: 'hct', n: '적혈구용적(HCT)', u: '%', re: /hct|pcv|헤마토크릿|적혈구\s?용적/i },
  { k: 'usg', n: '요비중', u: '', re: /요비중|usg/i },
  { k: 'glu', n: '혈당', u: 'mg/dL', re: /혈당|glu/i },
];
function labsIn(s) {
  const v = {};
  for (const L of LABS) {
    const m = s.match(L.re); if (!m) continue;
    const rest = s.slice(m.index + m[0].length).match(/^[^\d가-힣]{0,4}(?:[가-힣]{0,3}\s?)?(\d+(?:\.\d+)?)/);
    if (rest) v[L.k] = +rest[1];
  }
  return v;
}
const SYMPTOMS = ['구토', '설사', '식욕 없음', '기운 없음', '물 안 마심', '물 많이 마심', '기침·재채기', '침 흘림', '숨이 가쁨', '입 벌리고 숨쉼', '발작', '소변 안 봄', '쓰러짐·의식 흐림', '잇몸 창백', '기타'];
const URGENT = ['입 벌리고 숨쉼', '숨이 가쁨', '발작', '소변 안 봄', '쓰러짐·의식 흐림', '잇몸 창백'];
const FACTORS = [
  { v: 1.0, t: '아프거나 회복 중 (기초대사량 그대로)' },
  { v: 1.2, t: '중성화한 성묘·성견 유지' },
  { v: 1.4, t: '활동량 많음' },
  { v: 0.8, t: '체중 감량 중' },
];
const DEFAULT_TASKS = ['아침 급여', '저녁 급여', '아침 약', '저녁 약', '피하수액', '소변·배변 확인'];
const rer = kg => 70 * Math.pow(kg, 0.75);
function dayIndex(pet, k) {
  if (!pet?.plan?.start) return null;
  const a = new Date(pet.plan.start + 'T00:00'), b = new Date(k + 'T00:00');
  return Math.floor((b - a) / 864e5) + 1;
}
function rampFrac(pet, k) {
  if (!pet?.plan?.ramp || !pet.plan.start) return 1;
  const i = dayIndex(pet, k);
  if (i == null || i < 1) return 1;
  return i === 1 ? 1 / 3 : i === 2 ? 2 / 3 : 1;
}
function fullTarget(pet) {
  if (!pet) return null;
  if (num(pet.targetKcal)) return num(pet.targetKcal);
  const w = num(pet.weightKg); if (!w) return null;
  return rer(w) * (num(pet.factor) || 1);
}
function targetFor(pet, k) { const f = fullTarget(pet); return f == null ? null : f * rampFrac(pet, k); }
const kcalOf = (food, amt) => food && num(food.kcal) && num(food.per) ? num(food.kcal) / num(food.per) * amt : null;

/* ---------- state ---------- */
const S = { pet: null, petLoaded: false, logs: [], checks: [], me: null, mode: 'loading', readOnly: false, tab: 'today', filter: 'all', sumDays: 7, aiOff: true };
let backend = null, pendingRender = false;
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
S.me = ls.get('aigyeot-name') || null;

/* ---------- 저장소 (Supabase, 가족 링크 코드) ---------- */
const SB = 'https://pbmocpzclvndlevuvfto.supabase.co', SBKEY = 'sb_publishable_H42uVMl_0JG6NwuWhczkXw_85g9oaPi';
async function rpc(fn, body) {
  let r;
  try { r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SBKEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); }
  catch (e) { throw { code: 'offline' }; }
  const txt = await r.text();
  if (!r.ok) throw { code: /no_family/.test(txt) ? 'no_family' : /full/.test(txt) ? 'full' : 'http', message: txt };
  return txt ? JSON.parse(txt) : null;
}
function sbBackend(code) {
  const L = { pet: [], logs: [], checks: [] };
  const QK = 'aigyeot-q-' + code, CK = 'aigyeot-cache-' + code;
  let st = { pet: null, logs: [], checks: [] }, stamp = null, loading = false, again = false, flushing = false;
  let q = []; try { q = JSON.parse(ls.get(QK)) || []; } catch (e) {}
  try { const c = JSON.parse(ls.get(CK)); if (c) st = c; } catch (e) {}
  const saveQ = () => { ls.set(QK, JSON.stringify(q)); S.pending = q.length; renderBanner(); };
  const saveC = () => ls.set(CK, JSON.stringify(st));
  const emit = () => { L.pet.forEach(f => f(st.pet, { fromCache: false })); L.logs.forEach(f => f(st.logs)); L.checks.forEach(f => f(st.checks)); };
  function applyOp(s, op) {
    const b = op.body;
    if (op.fn === 'ag_save_pet') s.pet = JSON.parse(JSON.stringify(b.p_pet));
    else if (op.fn === 'ag_add_log') { if (!s.logs.some(l => l.id === b.p_id)) s.logs = [{ ...b.p_data, id: b.p_id }, ...s.logs].sort((a, c) => c.t - a.t); }
    else if (op.fn === 'ag_update_log') s.logs = s.logs.map(l => l.id === b.p_id ? { ...b.p_data, id: b.p_id } : l).sort((a, c) => c.t - a.t);
    else if (op.fn === 'ag_hide_log') s.logs = s.logs.filter(l => l.id !== b.p_id);
    else if (op.fn === 'ag_set_check') { s.checks = s.checks.filter(c => c.id !== b.p_id); if (b.p_data) s.checks.push({ ...b.p_data, id: b.p_id }); }
  }
  async function load() {
    if (loading) { again = true; return; } loading = true; again = false;
    try {
      const r = await rpc('ag_get', { p_code: code });
      st = { pet: r.pet || null, logs: r.logs || [], checks: r.checks || [] }; stamp = r.stamp;
      q.forEach(op => applyOp(st, op));
      saveC();
      if (S.slow) { S.slow = false; renderBanner(); }
      emit();
    } catch (e) {
      if (e.code === 'no_family') { if (ls.get('aigyeot-code') === code) ls.set('aigyeot-code', ''); setMode('nofamily-bad'); render(true); }
      else { S.slow = true; renderBanner(); }
    } finally { loading = false; if (again) load(); }
  }
  async function flush() {
    if (flushing || !q.length) return; flushing = true;
    try {
      while (q.length) {
        try { await rpc(q[0].fn, q[0].body); }
        catch (e) { if (e.code === 'offline') break; console.warn('drop', e); }
        q.shift(); saveQ();
      }
    } finally { flushing = false; }
    if (!q.length) { toast('보관해 둔 기록을 모두 보냈어요'); stamp = null; load(); }
  }
  async function send(fn, body) {
    const op = { fn, body: { p_code: code, ...body } };
    applyOp(st, op); saveC(); emit();
    if (q.length || navigator.onLine === false) { q.push(op); saveQ(); flush(); return; }
    try { await rpc(fn, op.body); }
    catch (e) { if (e.code === 'offline') { q.push(op); saveQ(); return; } throw e; }
    stamp = null; load();
  }
  async function poll() {
    if (document.hidden) return;
    if (q.length) { flush(); return; }
    try { const s = await rpc('ag_stamp', { p_code: code }); if (s !== stamp) load(); } catch (e) {}
  }
  setInterval(poll, 15000);
  window.addEventListener('online', () => { flush(); load(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); load(); } });
  S.pending = q.length;
  setTimeout(() => { if (st.pet || st.logs.length) emit(); renderBanner(); flush(); load(); });
  const sub = k => cb => { L[k].push(cb); return () => {}; };
  return {
    subPet: sub('pet'), subLogs: sub('logs'), subChecks: sub('checks'), refresh: () => { stamp = null; load(); },
    savePet: d => send('ag_save_pet', { p_pet: d }),
    addLog: d => send('ag_add_log', { p_id: Date.now().toString(36) + uid(), p_data: d }),
    updLog: (id, d) => send('ag_update_log', { p_id: id, p_data: d }),
    delLog: id => send('ag_hide_log', { p_id: id }),
    setCheck: (id, d) => send('ag_set_check', { p_id: id, p_data: d }),
  };
}
async function write(fn) {
  try { await fn(); return true; }
  catch (e) {
    console.warn(e);
    if (e?.code === 'full') toast('저장 공간이 가득 찼어요. 오래된 기록을 지워주세요');
    else if (e?.code === 'offline') toast('인터넷 연결을 확인해주세요');
    else toast('저장하지 못했어요. 잠시 후 다시 시도해주세요');
    backend?.refresh?.();
    return false;
  }
}

/* ---------- boot ---------- */
function setMode(m) {
  S.mode = m;
  const el = $('#sync');
  if (m === 'shared') { el.textContent = '가족 공유 중'; el.className = 'pill'; }
  else if (m === 'loading') { el.textContent = '연결 중…'; el.className = 'pill'; }
  else { el.textContent = ''; el.className = 'pill hidden'; }
  renderBanner();
}
function renderBanner() {
  let h = '';
  if (S.pending) h = `<div class="banner" style="background:var(--blue-soft);color:#2F4C77">인터넷이 끊겨서 기록 ${S.pending}건을 이 휴대폰에 보관 중이에요. 연결되면 자동으로 보낼게요.</div>`;
  else if (S.slow && S.mode === 'shared') h = '<div class="banner">기록 저장소에 연결하지 못했어요. 인터넷 연결을 확인해주세요. 보이는 기록은 마지막으로 받아온 내용이에요.</div>';
  $('#banner').innerHTML = h;
}
function start(b) {
  backend = b;
  b.subPet(p => { S.pet = p; S.petLoaded = true; render(); });
  b.subLogs(l => { S.logs = l; render(); });
  b.subChecks(c => { S.checks = c; render(); });
}
const familyCode = () => new URLSearchParams(location.search).get('g');
const shareLink = () => location.origin + location.pathname + '?g=' + familyCode();
function boot() {
  let code = familyCode();
  if (!code) { const saved = ls.get('aigyeot-code'); if (saved) { history.replaceState(null, '', location.pathname + '?g=' + saved + location.hash); code = saved; } }
  if (!code) { setMode('nofamily'); renderTabs(); render(true); return; }

  setMode('shared'); renderTabs(); render(true);
  start(sbBackend(code));
}
async function createFamily(btn) {

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, ic, n]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}"><span class="ic">${ic}</span>${n}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {

  S.tab = b.dataset.tab; renderTabs(); render(true); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + S.tab); } catch (e) {}
});
{ const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) S.tab = h; }

function render(force) {
  const a = document.activeElement;
  if (!force && a && $('#main').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { pendingRender = true; return; }
  pendingRender = false;
  if (S.mode === 'nofamily' || S.mode === 'nofamily-bad') { $('#main').innerHTML = vLanding(); document.querySelector('nav.tabs').classList.add('hidden'); return; }

  $('#hdrSub').textContent = p?.weightKg ? `${p.species === 'dog' ? '강아지' : '고양이'} · ${p.weightKg}kg${p.condition ? ' · ' + p.condition : ''}` : '아픈 아이 케어 기록';
  const v = { today: vToday, er: vEr, calc: vCalc, logs: vLogs, vet: vVet, set: vSet }[S.tab];
  $('#main').innerHTML = v();

}
$('#main').addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 50));

function writeCard() {

      <div class="two" style="margin-top:12px"><button class="btn ghost" data-act="p-cancel">다시 쓰기</button><button class="btn" data-act="p-save">모두 저장</button></div></div>`;
  } else if (P) h += `<p class="muted" style="margin-top:10px">정리할 내용을 찾지 못했어요. 조금 더 자세히 적어주세요.</p>`;

function kcalCard() {

  const pct = Math.min(100, eaten / tgt * 100);

  const ramp = di && di >= 1 && di <= 2 ? `<span class="pill" style="background:var(--acc-soft);color:var(--acc)">늘려가기 ${di}일차 · 목표의 ${di === 1 ? '1/3' : '2/3'}</span>` : '';
  return `<div class="card"><div class="row between"><h3 style="margin:0">오늘 먹은 양</h3>${ramp}</div>
    <div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="big">${r0(eaten)}</span><span class="muted">/ ${r0(tgt)} kcal</span></div>

}

function recentCard() {

function logText(l) {
  switch (l.type) {
    case 'feed': return `${esc(l.food || '급여')} ${l.amount ?? ''}${esc(l.unit || '')}${num(l.kcal) ? ` · ${r0(l.kcal)}kcal` : ''}${l.method ? ` · ${esc(l.method)}` : ''}`;
    case 'med': return `${esc(l.name || '약')}${l.dose ? ' · ' + esc(l.dose) : ''}`;
    case 'fluid': return `피하수액 ${l.ml ?? ''}ml`;
    case 'symptom': return `${esc((l.symptoms || []).join(', ') || '증상')} · ${['', '약함', '중간', '심함'][l.severity || 1]}`;
    case 'weight': return `${l.kg}kg`;
    case 'potty': return [l.pee && '소변 ' + esc(l.pee), l.poop && '대변 ' + esc(l.poop)].filter(Boolean).join(' · ') || '배변';
    case 'lab': return LABS.filter(L => l.values && l.values[L.k] != null).map(L => `${L.n} ${l.values[L.k]}`).join(' · ') || '검사';
    default: return '';
  }
}

/* ----- charts ----- */
function lineChart(pts, opt) {
  const W = 320, H = 150, L = 34, R = 12, T = 18, B = 26;
  if (!pts.length) return '';
  const xs = pts.map(p => p.t), ys = pts.map(p => p.v);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= 864e5; x1 += 864e5; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.2 || Math.abs(y1) * 0.1 || 1; y0 -= pad; y1 += pad;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const fmt = v => Math.abs(v) >= 100 ? r0(v) : Math.abs(v) < 10 ? Math.round(v * 100) / 100 : r1(v);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const showAll = pts.length <= 7;
  const md = t => { const x = new Date(t); return (x.getMonth() + 1) + '/' + x.getDate(); };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[y0 + pad, (y0 + y1) / 2, y1 - pad].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEE7DF"/><text x="${L - 6}" y="${Y(v) + 4}" font-size="10" fill="#9A9087" text-anchor="end">${fmt(v)}</text>`).join('')}
    <path d="${d}" fill="none" stroke="${opt.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 4.5 : 3.5}" fill="${i === pts.length - 1 ? opt.color : '#fff'}" stroke="${opt.color}" stroke-width="2"/>${showAll || i === pts.length - 1 ? `<text x="${X(p.t)}" y="${Y(p.v) - 9}" font-size="11" font-weight="700" fill="#2D2A26" text-anchor="middle">${fmt(p.v)}</text>` : ''}`).join('')}
    <text x="${L}" y="${H - 6}" font-size="10" fill="#9A9087">${md(pts[0].t)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" fill="#9A9087" text-anchor="end">${md(pts[pts.length - 1].t)}</text>
  </svg>`;
}
function barChart(days, target) {
  const W = 320, H = 150, L = 34, R = 8, T = 16, B = 24;
  const max = Math.max(target || 0, ...days.map(d => d.v), 1) * 1.15;
  const bw = (W - L - R) / days.length;
  const Y = v => T + (1 - v / max) * (H - T - B);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${days.map((d, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, ok = target && d.v >= target * 0.9; return `<rect x="${x}" y="${Y(d.v)}" width="${w}" height="${Math.max(0, H - B - Y(d.v))}" rx="3" fill="${d.v ? (ok ? '#3D8B7D' : '#E07A5F') : '#EEE7DF'}"/>${i % 2 === 1 || i === days.length - 1 ? `<text x="${x + w / 2}" y="${H - 8}" font-size="9.5" fill="#9A9087" text-anchor="middle">${d.label}</text>` : ''}`; }).join('')}
    ${target ? `<line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" stroke="#2D2A26" stroke-dasharray="4 4" opacity=".5"/><text x="${L - 6}" y="${Y(target) + 4}" font-size="10" fill="#2D2A26" text-anchor="end">${r0(target)}</text>` : ''}
  </svg>`;
}
function vCharts() {
  const p = S.pet || {}, asc = S.logs.slice().sort((a, b) => a.t - b.t);
  let h = `<button class="btn acc full" data-act="new" data-type="lab" style="margin-bottom:12px">🧪 검사 수치 넣기</button>`;
  const labs = asc.filter(l => l.type === 'lab' && l.values);
  const shown = LABS.filter(L => labs.some(l => l.values[L.k] != null));
  if (shown.length) shown.forEach(L => {

  const days = []; for (let i = 13; i >= 0; i--) { const k = dkey(Date.now() - i * 864e5); const d = new Date(k + 'T00:00'); days.push({ k, label: (d.getMonth() + 1) + '/' + d.getDate(), v: 0 }); }
  S.logs.forEach(l => { if (l.type === 'feed' && num(l.kcal)) { const d = days.find(x => x.k === dkey(l.t)); if (d) d.v += num(l.kcal); } });

  return h;
}

function calcRead() {

}
function calcUpdate() {
  const out = $('#c-out'); if (!out) return;
  const w = num(C.weight), meals = Math.max(1, Math.round(num(C.meals) || 1));
  if (!w && !num(C.override)) { out.innerHTML = '<div class="card muted">체중을 넣으면 결과가 나와요.</div>'; return; }
  const base = w ? rer(w) : null;
  const full = num(C.override) || base * (num(C.factor) || 1);
  const pseudo = { plan: { ramp: C.ramp, start: C.start } };
  const k = today(), frac = rampFrac(pseudo, k), di = C.ramp ? dayIndex(pseudo, k) : null;
  const todayK = full * frac;
  const foods = S.pet?.foods || [];
  const mix = C.mix.filter(m => foods.some(f => f.id === m.foodId));
  const pctSum = mix.reduce((s, m) => s + (num(m.pct) || 0), 0);

      const share = (num(m.pct) || 0) / pctSum;
      const perUnit = num(f.kcal) / num(f.per);
      if (!perUnit) return;
      const dayAmt = todayK * share / perUnit, mealAmt = dayAmt / meals;
      if (f.unit === 'g' || f.unit === 'ml') vol += mealAmt;
      rows += `<tr><td>${esc(f.name)}${mix.length > 1 ? ` (${r0(share * 100)}%)` : ''}<br><span class="muted">하루 ${r1(dayAmt)}${esc(f.unit)}</span></td><td>회당 ${r1(mealAmt)}${esc(f.unit)}</td></tr>`;
    });

  const ramps = C.ramp ? [1, 2, 3].map(d => `<td style="text-align:center;font-weight:${di === d ? 700 : 400};${di === d ? 'color:var(--acc)' : ''}">${d}일차<br>${r0(full * (d === 1 ? 1 / 3 : d === 2 ? 2 / 3 : 1))}kcal</td>`).join('') : '';
  out.innerHTML = `<div class="res">
    <div class="k">${num(C.override) ? '주치의 지정 칼로리' : `기초대사량 ${r0(base)}kcal × ${num(C.factor) || 1}`}</div>
    <div class="row" style="align-items:baseline;gap:6px"><span class="big">${r0(todayK)}</span><span class="muted">kcal / 오늘${frac < 1 ? ` (전량 ${r0(full)}kcal의 ${frac < .5 ? '1/3' : '2/3'})` : ''}</span></div>
    <div class="muted">회당 약 ${r0(todayK / meals)}kcal × ${meals}회</div>
    ${ramps ? `<table style="margin-top:8px"><tr>${ramps}</tr></table>` : ''}
    ${rows ? `<table style="margin-top:10px">${rows}${totalVol > 0 ? `<tr><td>회당 총량${water ? ` (물 ${water}ml 포함)` : ''}</td><td>약 ${r1(totalVol)}ml${syr ? ` · ${syr}ml 주사기 ${r1(totalVol / syr)}개` : ''}</td></tr>` : ''}</table>${warn}` : ''}

}

/* ----- vet summary ----- */
function buildSummary(days) {
  const p = S.pet || {};
  const since = Date.now() - days * 864e5;
  const L = S.logs.filter(l => l.t >= since).slice().sort((a, b) => a.t - b.t);
  const lines = [];
  lines.push(`[${p.name || '아이'} 케어 요약 · 최근 ${days}일]`);
  lines.push(`${p.species === 'dog' ? '강아지' : '고양이'}${p.age ? ' · ' + p.age : ''}${p.weightKg ? ' · 현재 ' + p.weightKg + 'kg' : ''}${p.condition ? ' · ' + p.condition : ''}`);
  const ws = L.filter(l => l.type === 'weight');
  if (ws.length) lines.push('', '■ 체중', ws.map(w => `${dkey(w.t).slice(5)} ${w.kg}kg`).join(' → '));
  const ft = fullTarget(p);
  const byDay = {};
  L.filter(l => l.type === 'feed').forEach(l => { const k = dkey(l.t); byDay[k] = (byDay[k] || 0) + (num(l.kcal) || 0); });
  const dk = Object.keys(byDay).sort();
  if (dk.length) {
    lines.push('', '■ 하루 섭취 칼로리' + (ft ? ` (목표 ${r0(ft)}kcal)` : ''));
    dk.forEach(k => lines.push(`${k.slice(5)}  ${r0(byDay[k])}kcal`));
    const methods = [...new Set(L.filter(l => l.type === 'feed' && l.method).map(l => l.method))];
    if (methods.length) lines.push('급여 방식: ' + methods.join(', '));
  }
  const sy = L.filter(l => l.type === 'symptom');
  if (sy.length) { lines.push('', '■ 증상'); sy.forEach(s => lines.push(`${dkey(s.t).slice(5)} ${hm(s.t)}  ${(s.symptoms || []).join(', ')} (${['', '약함', '중간', '심함'][s.severity || 1]})${s.memo ? ' - ' + s.memo : ''}`)); }
  const meds = L.filter(l => l.type === 'med');
  if (meds.length) {
    lines.push('', '■ 투약');
    const g = {}; meds.forEach(m => { const k = (m.name || '약') + (m.dose ? ' ' + m.dose : ''); g[k] = (g[k] || 0) + 1; });
    Object.entries(g).forEach(([k, n]) => lines.push(`${k}  ${n}회`));
  }
  const fl = L.filter(l => l.type === 'fluid');
  if (fl.length) lines.push('', '■ 피하수액', `${fl.length}회, 총 ${fl.reduce((s, f) => s + (num(f.ml) || 0), 0)}ml (회당 ${[...new Set(fl.map(f => f.ml))].join('/')}ml)`);
  const pt = L.filter(l => l.type === 'potty');
  if (pt.length) { lines.push('', '■ 배변·소변'); pt.slice(-10).forEach(x => lines.push(`${dkey(x.t).slice(5)} ${hm(x.t)}  ${[x.pee && '소변 ' + x.pee, x.poop && '대변 ' + x.poop].filter(Boolean).join(', ')}`)); }
  const allLabs = S.logs.filter(l => l.type === 'lab' && l.values).slice().sort((a, b) => a.t - b.t);
  const labLines = LABS.map(Lb => { const ps = allLabs.filter(l => l.values[Lb.k] != null); if (!ps.length) return null; const last = ps[ps.length - 1]; return `${Lb.n} ${last.values[Lb.k]}${Lb.u ? ' ' + Lb.u : ''} (${dkey(last.t).slice(5)})${ps.length > 1 ? ` ← 이전 ${ps[ps.length - 2].values[Lb.k]} (${dkey(ps[ps.length - 2].t).slice(5)})` : ''}`; }).filter(Boolean);
  if (labLines.length) lines.push('', '■ 최근 검사 수치', ...labLines);
  const nt = L.filter(l => l.type === 'note' || ((l.type === 'feed' || l.type === 'med') && l.memo));
  if (nt.length) { lines.push('', '■ 메모'); nt.slice(-8).forEach(n => lines.push(`${dkey(n.t).slice(5)}  ${n.memo || ''}`)); }
  if (p.questions) lines.push('', '■ 선생님께 여쭤볼 것', p.questions);
  if (L.length === 0) lines.push('', '이 기간에 남긴 기록이 없어요.');
  return lines.join('\n');
}

function erRule(state) {
  const hit = URGENT.some(u => state.includes(u.split(/[·\s]/)[0])) || /숨|호흡|헐떡|발작|경련|쓰러|의식|창백|하얗|피를|소변.*안|오줌.*안/.test(state);
  return hit
    ? { level: 'now', headline: '빨리 진료가 필요할 수 있는 증상이에요. 지금 병원에 전화하세요.', doNow: ['다니는 병원이 닫았다면 가까운 24시 동물병원에 먼저 전화해 받아줄 수 있는지 확인하기', '이동장에 넣어 조용하고 따뜻하게 옮기기', '아래 "전화할 때 읽을 말"을 그대로 읽어주기'], avoid: ['억지로 먹이거나 물 먹이기', '사람 약 먹이기'], bring: ['먹는 약 봉투', '최근 검사지', '이 앱의 병원 요약'] }
    : { level: 'today', headline: '정확한 판단이 어려워요. 주치의 병원에 전화해 상태를 설명하고 진료가 필요한지 물어보세요.', doNow: ['증상이 나타난 시간과 횟수를 기록하기', '상태가 나빠지면 바로 24시 병원에 연락하기'], avoid: ['사람 약 먹이기'], bring: ['먹는 약 봉투', '최근 검사지'] };
}
async function erCheck() {
  const ta = $('#er-state'); S.erState = ta ? ta.value.trim() : S.erState;
  if (!S.erState) return toast('지금 상태를 적어주세요');
  S.erBusy = true; S.er = null; render(true);
  const p = S.pet || {};
  let res = null;
  if (sampleFn && !S.aiOff) {
    try {
      res = await sampleFn.json(`너는 반려동물 응급 상황에서 보호자가 병원에 가기 전 무엇을 할지 정리해주는 도우미야. 진단이나 약 처방, 약 용량은 절대 말하지 마. 사람 약을 권하지 마. 집에서 하는 처치는 안전하고 일반적인 것(보온, 안정, 이동 방법, 기록, 병원 연락)만 말해. 조금이라도 위험해 보이면 level을 "now"로 해.
아이: ${p.species === 'dog' ? '강아지' : '고양이'}, ${p.age || '나이 미상'}, ${p.weightKg ? p.weightKg + 'kg' : '체중 미상'}, 진단: ${p.condition || '모름'}
최근 48시간 기록:
${recentBrief(48) || '(없음)'}

보호자가 적은 지금 상태:
"""${S.erState.slice(0, 1500)}"""

JSON만 답해: {"level":"now|today|watch","headline":"한두 문장 판단 이유","doNow":["병원 가기 전 할 일, 최대 4개"],"avoid":["하지 말 것, 최대 3개"],"bring":["병원에 챙길 것, 최대 3개"],"transfusion":"빈혈·출혈·잇몸 창백 등 수혈이 필요할 수 있는 상황이면 전화할 때 수혈 가능 여부를 먼저 물어보라는 한 문장, 아니면 null"}
level 기준: now=지금 바로 병원(24시 포함), today=오늘 안에 진료, watch=지켜보며 기록하고 변화 있으면 연락.`, { cache: false });
      if (!res || !['now', 'today', 'watch'].includes(res.level)) res = null;
      else ['doNow', 'avoid', 'bring'].forEach(k => { res[k] = (Array.isArray(res[k]) ? res[k] : []).map(String).slice(0, 4); });
    } catch (e) {
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) S.aiOff = true;
    }
  }
  if (!res) res = erRule(S.erState);
  S.erBusy = false; S.er = res; render(true);
}

function fillSheet(E) {

    if (/먹|급여|강급|캔|사료|밥|그램|\dg\b|주사기|튜브|파우치|츄르/.test(s) && (!/안\s?먹/.test(s) || /강급|주사기|튜브|\d\s*(g|그램|ml|캔|포)/.test(s))) {
      const f = foods.find(x => s.includes(x.name)) || foods[0];
      let amount = null, unit = null;
      if (/반\s?캔/.test(s)) { amount = 0.5; unit = '캔'; }
      else if ((m = s.match(/(\d+(?:\.\d+)?)\s*(g|그램|ml|cc|캔|포|개|봉|스틱)/i))) { amount = +m[1]; unit = { 그램: 'g', cc: 'ml' }[m[2]] || m[2].toLowerCase(); if (/개|봉|스틱/.test(unit)) { const f2 = foods.find(x => s.includes(x.name)); unit = f2 && /포|캔/.test(f2.unit) ? f2.unit : '개'; } }
      const fsy = symOf(s); if (fsy.length) out.push({ ...base, type: 'symptom', symptoms: fsy, severity: sevOf(s) });
      out.splice(fsy.length ? out.length - 1 : out.length, 0, { ...base, type: 'feed', foodId: f && s.includes(f.name) ? f.id : (f && unit === f.unit ? f.id : null), food: f && (s.includes(f.name) || unit === f.unit) ? f.name : '급여', amount, unit, method: /강급|주사기/.test(s) ? '강급' : /튜브/.test(s) ? '튜브' : /조금|일부|남겼/.test(s) ? '일부만 먹음' : /혼자|스스로|자율/.test(s) ? '스스로 먹음' : null });
      continue;
    }
    const sy = symOf(s);
    if (sy.length) { out.push({ ...base, type: 'symptom', symptoms: sy, severity: sevOf(s) }); continue; }
    out.push({ ...base, type: 'note', memo: s });
  }
  const tasks = p.tasks || [], k = today();
  const taskIds = tasks.filter(t => out.some(e => e.dayOffset === 0 && t.label.split(/\s+/).every(w => e.src.includes(w) || (w === '급여' && e.type === 'feed') || (w === '약' && e.type === 'med') || (w === '피하수액' && e.type === 'fluid')))).map(t => t.id);
  return { ai: false, entries: out.map(normEntry), taskIds };
}
async function doParse() {
  const ta = $('#w-text'); S.draft = ta ? ta.value : S.draft;
  const text = (S.draft || '').trim(); if (!text) return toast('먼저 내용을 적어주세요');
  S.parsing = true; render(true);
  let res = null;
  if (sampleFn && !S.aiOff) {
    try { res = await aiParse(text); }
    catch (e) {
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) S.aiOff = true;
      else if (e?.code === 'rate_limited') toast('Claude가 잠시 바빠서 기본 방식으로 정리했어요');
    }
  }
  if (!res) res = ruleParse(text);
  S.parsing = false; S.parsed = res; render(true);
}
async function saveParsed() {
  const P = S.parsed; if (!P || !P.entries.length) return;
  if (S.readOnly) return toast('보기 전용이라 저장할 수 없어요');
  const btn = document.querySelector('[data-act="p-save"]'); if (btn) btn.disabled = true;
  let n = 0;
  for (const e of P.entries) {
    const d = { ...e, by: S.me || null }; delete d.timeGuess; delete d.dateOnly;
    Object.keys(d).forEach(k => d[k] === undefined && delete d[k]);
    if (await write(() => backend.addLog(d))) n++; else break;
  }
  const k = today();
  for (const id of P.taskIds) { const cid = k + '_' + id; if (!S.checks.some(c => c.id === cid)) await write(() => backend.setCheck(cid, { date: k, taskId: id, by: S.me || null, t: Date.now() })); }
  const w = P.entries.filter(e => e.type === 'weight' && e.kg).sort((a, b) => a.t - b.t).pop();
  if (w && S.logs.some(l => l.type === 'weight' && l.t > w.t)) w.kg = null;
  if (w && w.kg && S.pet) { const np = petBase(); np.weightKg = w.kg; await write(() => backend.savePet(np)); S.pet = np; C = null; }
  if (n === P.entries.length) { S.parsed = null; S.draft = ''; toast(`${n}건 저장했어요`); }
  render(true);
}
$('#main').addEventListener('input', e => { if (e.target.id === 'w-text') S.draft = e.target.value; if (e.target.id === 'er-state') S.erState = e.target.value; });

/* ---------- actions ---------- */
let delArm = null;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'create') createFamily(b);
  else if (a === 'rotate') { S.rotArm = true; render(true); }
  else if (a === 'rotate-no') { S.rotArm = false; render(true); }
  else if (a === 'rotate-yes') {
    if (S.pending) return toast('보관 중인 기록을 먼저 보낸 뒤에 바꿀 수 있어요. 인터넷 연결을 확인해주세요');
    b.disabled = true; b.textContent = '바꾸는 중…';
    try {
      const old = familyCode(), nc = await rpc('ag_rotate', { p_code: old });
      ls.set('aigyeot-code', nc); ls.set('aigyeot-cache-' + old, ''); ls.set('aigyeot-q-' + old, '');
      try { sessionStorage.setItem('aigyeot-rotated', '1'); } catch (err) {}
      location.replace(location.pathname + '?g=' + nc + '#set');
    } catch (err) { toast('바꾸지 못했어요. 인터넷 연결을 확인해주세요'); S.rotArm = false; render(true); }
  }
  else if (a === 'join') { const v = ($('#join')?.value || '').trim(); const m = v.match(/[?&]g=([0-9a-f]{20,64})/i) || v.match(/^([0-9a-f]{20,64})$/i); if (!m) return toast('링크가 맞지 않아요. 가족에게 받은 링크 전체를 붙여넣어 주세요'); history.replaceState(null, '', location.pathname + '?g=' + m[1]); boot(); }
  else if (a === 'setname') { const v = (b.dataset.v || $('#nm')?.value || '').trim().slice(0, 10); if (!v) return toast('이름을 넣어주세요'); S.me = v; ls.set('aigyeot-name', v); toast(v + '(으)로 기록할게요'); render(true); }
  else if (a === 'share') { const url = shareLink(), text = `${S.pet?.name || '우리 아이'} 케어 기록을 같이 써요. 이 링크로 들어오면 돼요.`; if (navigator.share) { try { await navigator.share({ title: '아이곁', text, url }); } catch (err) {} } else { try { await navigator.clipboard.writeText(text + '\n' + url); toast('복사했어요. 카톡에 붙여넣어 주세요'); } catch (err) { toast('링크를 길게 눌러 복사해주세요'); } } }
  else if (a === 'copy-link') { try { await navigator.clipboard.writeText(shareLink()); toast('링크를 복사했어요'); } catch (err) { toast('링크를 길게 눌러 복사해주세요'); } }
  else if (a === 'er-check') erCheck();
  else if (a === 'er-area') { const v = $('#er-area').value.trim(); S.area = v; if (S.pet) { const p = petBase(); p.area = v; savePet(p, '동네를 저장했어요'); } else render(true); }
  else if (a === 'copy-call') { const txt = $('#callText').textContent; try { await navigator.clipboard.writeText(txt); toast('복사했어요'); } catch (err) { const r = document.createRange(); r.selectNodeContents($('#callText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('글자를 길게 눌러 복사해주세요'); } }
  else if (a === 'parse') doParse();
  else if (a === 'p-del') { S.parsed.entries.splice(+b.dataset.i, 1); render(true); }
  else if (a === 'p-cancel') { S.parsed = null; render(true); $('#w-text')?.focus(); }
  else if (a === 'p-save') saveParsed();
  else if (a === 'new') openSheet(b.dataset.type);
  else if (a === 'edit') { const l = S.logs.find(x => x.id === b.dataset.id); if (l) openSheet(l.type, l); }
  else if (a === 'logview') { S.logView = b.dataset.v; render(true); }
  else if (a === 'install') { if (S.installEvt) { S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch (err) {} S.installEvt = null; render(true); } }
  else if (a === 'install-hide') { ls.set('aigyeot-install-hide', '1'); render(true); }
  else if (a === 'close') closeSheet();
  else if (a === 'save-log') saveLog();
  else if (a === 'tab' || a === 'go-set') { S.tab = a === 'go-set' ? 'set' : b.dataset.to; renderTabs(); render(true); window.scrollTo(0, 0); }
  else if (a === 'filter') { S.filter = b.dataset.f; render(true); }
  else if (a === 'sumdays') { S.sumDays = +b.dataset.d; render(true); }
  else if (a === 'sym') { const v = b.dataset.v; F.symptoms = F.symptoms.includes(v) ? F.symptoms.filter(x => x !== v) : [...F.symptoms, v]; b.classList.toggle('on'); urgentCheck(); }
  else if (a === 'sev') { F.severity = +b.dataset.v; document.querySelectorAll('#n-sev .chip').forEach(c => c.classList.toggle('on', c === b)); }
  else if (a === 'pee' || a === 'poop') { F[a] = F[a] === b.dataset.v ? '' : b.dataset.v; document.querySelectorAll(`#n-${a} .chip`).forEach(c => c.classList.toggle('on', c.dataset.v === F[a])); urgentCheck(); }
  else if (a === 'pick-med') { $('#n-name').value = b.dataset.v; const last = S.logs.find(l => l.type === 'med' && l.name === b.dataset.v); if (last?.dose) $('#n-dose').value = last.dose; }
  else if (a === 'del') {
    if (delArm !== b.dataset.id) { delArm = b.dataset.id; b.textContent = '정말 삭제?'; b.classList.add('sure'); setTimeout(() => { if (delArm === b.dataset.id) { delArm = null; b.textContent = '삭제'; b.classList.remove('sure'); } }, 3000); return; }
    delArm = null; if (await write(() => backend.delLog(b.dataset.id))) toast('삭제했어요');
  }
  else if (a === 'check') {
    if (S.readOnly) return toast('보기 전용이에요');
    const id = today() + '_' + b.dataset.id, has = S.checks.some(c => c.id === id);
    await write(() => backend.setCheck(id, has ? null : { date: today(), taskId: b.dataset.id, by: S.me || null, t: Date.now() }));
  }
  else if (a === 'copy') {
    const txt = buildSummary(S.sumDays);
    try { await navigator.clipboard.writeText(txt); toast('복사했어요'); }
    catch (err) { const r = document.createRange(); r.selectNodeContents($('#sumText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('글자를 길게 눌러 복사해주세요'); }
  }
  else if (a === 'save-q') { const p = petBase(); p.questions = $('#qText').value.trim(); savePet(p); }
  else if (a === 'save-pet') {
    const p = petBase();

    const w = num($('#s-weight').value); p.weightKg = w; p.condition = $('#s-cond').value.trim();
    if (!p.name) return toast('이름을 넣어주세요');
    C = null; savePet(p);
  }
  else if (a === 'food-add') {
    const name = $('#f-name').value.trim(), kcal = num($('#f-kcal').value), per = num($('#f-per').value), unit = $('#f-unit').value;
    if (!name || !kcal || !per) return toast('이름, kcal, 양을 모두 넣어주세요');
    const p = petBase(); p.foods = [...(p.foods || []), { id: uid(), name, kcal, per, unit }];
    if (!p.mix || !p.mix.length) p.mix = [{ foodId: p.foods[0].id, pct: 100 }];
    C = null; savePet(p, '사료를 추가했어요');
  }
  else if (a === 'food-del') { const p = petBase(); p.foods = (p.foods || []).filter(f => f.id !== b.dataset.id); p.mix = (p.mix || []).filter(m => m.foodId !== b.dataset.id); C = null; savePet(p, '삭제했어요'); }
  else if (a === 'task-add') { const v = $('#t-label').value.trim(); if (!v) return; const p = petBase(); p.tasks = [...(p.tasks || []), { id: uid(), label: v }]; savePet(p, '추가했어요'); }
  else if (a === 'task-default') { const p = petBase(); p.tasks = DEFAULT_TASKS.map(l => ({ id: uid(), label: l })); savePet(p, '추가했어요. 필요 없는 건 지워주세요'); }
  else if (a === 'task-del') { const p = petBase(); p.tasks.splice(+b.dataset.i, 1); savePet(p, '삭제했어요'); }
  else if (a === 'task-up') { const p = petBase(), i = +b.dataset.i; [p.tasks[i - 1], p.tasks[i]] = [p.tasks[i], p.tasks[i - 1]]; savePet(p, '순서를 바꿨어요'); }
  else if (a === 'mix-add') { calcRead(); const f = (S.pet?.foods || [])[0]; if (!f) return; C.mix.push({ foodId: f.id, pct: 0 }); render(true); }
  else if (a === 'mix-del') { calcRead(); C.mix.splice(+b.dataset.i, 1); render(true); }
  else if (a === 'calc-save') {
    calcRead();
    if (!S.pet) return toast('먼저 설정에서 아이 정보를 저장해주세요');
    const p = petBase();
    p.weightKg = num(C.weight); p.factor = num(C.factor) || 1; p.targetKcal = num(C.override); p.meals = Math.max(1, Math.round(num(C.meals) || 1));
    p.plan = { ramp: !!C.ramp, start: C.start }; p.water = num(C.water); p.syringe = num(C.syringe);
    p.mix = C.mix.map(m => ({ foodId: m.foodId, pct: num(m.pct) || 0 }));
    savePet(p, '저장했어요. 가족 화면에도 반영돼요');
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab) { S.tab = h; renderTabs(); render(true); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
